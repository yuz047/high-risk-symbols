name: High-Risk Symbols static security master

on:
  schedule:
    # Monthly static/company-field refresh. Daily market stats live elsewhere.
    - cron: '15 1 1 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'max new Massive ticker-overview calls this run'
        type: number
        required: false
        default: 250
      sleep_sec:
        description: 'seconds to sleep after each Massive call'
        type: number
        required: false
        default: 15
      refresh_directory:
        description: 'refresh NASDAQ Trader symbol directory before backfill'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: high-risk-symbols-api
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}

jobs:
  static-master:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install deps
        run: pip install -r python/requirements.txt

      - name: Backfill static fundamentals
        run: |
          args=(--limit "${{ github.event.inputs.limit || 250 }}" --sleep-sec "${{ github.event.inputs.sleep_sec || 15 }}")
          if [ "${{ github.event.inputs.refresh_directory || 'true' }}" = "true" ]; then
            args+=(--refresh-directory)
          fi
          python python/backfill_fundamentals.py "${args[@]}"

      - name: Validate static master
        run: python python/validate_data.py

      - name: Commit refreshed static master
        run: |
          git config user.name "high-risk-bot"
          git config user.email "high-risk-bot@users.noreply.github.com"
          git add data/security_master.json
          if git diff --cached --quiet; then
            echo "No static master changes."
          else
            git commit -m "data: static security master refresh $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "Push failed after ${attempt} attempts."
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi

name: High-Risk Symbols daily

on:
  schedule:
    # 00:30 UTC Tue–Sat ≈ 20:30 ET Mon–Fri (after the US close).
    - cron: '30 0 * * 2-6'
  workflow_dispatch:
    inputs:
      reseed:
        description: 'rebuild the deterministic seed universe before scanning'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # so the job can commit refreshed data/*.json back to the repo

env:
  # GitHub is forcing JS actions to Node 24 on 2026-06-02; opt in now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Restore Massive details cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: massive-details-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            massive-details-${{ runner.os }}-

      - name: Install deps
        run: pip install -r python/requirements.txt

      - name: (optional) Rebuild seed universe
        if: github.event.inputs.reseed == 'true'
        working-directory: python
        run: python seed_universe.py

      - name: Run daily scan
        working-directory: python
        run: python run_daily.py

      - name: Commit refreshed data/
        run: |
          git config user.name "high-risk-bot"
          git config user.email "high-risk-bot@users.noreply.github.com"
          git add data/symbols.json data/meta.json data/history.json data/security_master.json data/market_stats.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: scan refresh $(date -u +%Y-%m-%d)"
            git push
          fi

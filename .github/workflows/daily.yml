name: High-Risk Symbols daily

on:
  schedule:
    # 00:30 UTC Tue–Sat ≈ 20:30 ET Mon–Fri (after the US close).
    - cron: '30 0 * * 2-6'
  workflow_dispatch:
    inputs:
      reseed:
        description: 'rebuild the deterministic seed universe before scanning'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # so the job can commit refreshed data/*.json back to the repo

concurrency:
  group: high-risk-symbols-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub is forcing JS actions to Node 24 on 2026-06-02; opt in now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Validate checked-out scanner
        run: |
          echo "github.sha=${GITHUB_SHA}"
          echo "git head=$(git rev-parse HEAD)"
          grep -n "Daily scans must treat this file as read-only" python/data.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/security_master.json")
          if not p.exists():
              print("security_master: missing")
          else:
              d = json.loads(p.read_text())
              rows = d.get("rows", [])
              coverage = sum(1 for r in rows if r.get("shares_out") is not None and r.get("market_cap") is not None)
              print(f"security_master: source={d.get('source')} count={d.get('count')} rows={len(rows)} coverage={coverage}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install deps
        run: pip install -r python/requirements.txt

      - name: (optional) Rebuild seed universe
        if: github.event.inputs.reseed == 'true'
        working-directory: python
        run: python seed_universe.py

      - name: Run daily scan
        working-directory: python
        run: python run_daily.py

      - name: Verify static security master is unchanged
        run: git diff --exit-code -- data/security_master.json

      - name: Validate data files
        run: python python/validate_data.py

      - name: Commit refreshed data/
        run: |
          git config user.name "high-risk-bot"
          git config user.email "high-risk-bot@users.noreply.github.com"
          git add data/symbols.json data/meta.json data/history.json data/market_stats.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: scan refresh $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "Push failed after ${attempt} attempts."
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
